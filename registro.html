<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InterShop - Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">InterShop</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="productos.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link active" href="registro.html">Registro</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-header bg-dark text-white text-center py-3">
            <h4 class="mb-0">Registro de Usuario</h4>
          </div>
          <div class="card-body p-4">
            <form id="form-registro" novalidate>
              <!-- Nombre -->
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre Completo *</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ej. Juan Pérez">
                <span id="error-nombre" class="mensaje-error"></span>
              </div>

              <!-- Correo -->
              <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico *</label>
                <input type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com">
                <span id="error-correo" class="mensaje-error"></span>
              </div>

              <!-- Contraseña -->
              <div class="mb-3">
                <label for="password" class="form-label">Contraseña *</label>
                <input type="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres">
                <span id="error-password" class="mensaje-error"></span>
              </div>

              <!-- Rol (Control Select) -->
              <div class="mb-3">
                <label for="rol" class="form-label">Tipo de Cuenta *</label>
                <select id="rol" class="form-select">
                  <option value="">-- Selecciona un rol --</option>
                  <option value="cliente">Comprador / Cliente</option>
                  <option value="vendedor">Vendedor</option>
                </select>
                <span id="error-rol" class="mensaje-error"></span>
              </div>

              <!-- Checkbox Términos -->
              <div class="mb-3 form-check">
                <input type="checkbox" id="terminos" class="form-check-input">
                <label for="terminos" class="form-check-label">Acepto los términos y condiciones de InterShop *</label>
                <span id="error-terminos" class="mensaje-error"></span>
              </div>

              <button type="submit" class="btn btn-primary w-100">Crear Cuenta</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
      <p class="mb-0">InterShop &copy; 2026 - Universidad Autónoma de Yucatán</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/validaciones.js"></script>
</body>
</html>
